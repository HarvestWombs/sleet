<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b2030"/>
      <stop offset="1" stop-color="#0d1018"/>
    </linearGradient>
    <linearGradient id="ice" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7fb8ff"/>
      <stop offset="1" stop-color="#e6f4ff"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#tile)"/>
  <!-- Sleet: staggered slanted streaks of different lengths, driven by wind -->
  <g fill="none" stroke="url(#ice)" stroke-linecap="round" stroke-width="30">
    <path d="M178 104 L126 268"/>
    <path d="M262 156 L194 372"/>
    <path d="M340 110 L300 236"/>
    <path d="M404 210 L352 374"/>
    <path d="M292 312 L268 388"/>
