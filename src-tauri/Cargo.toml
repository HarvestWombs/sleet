[package]
name = "sleet"
version = "0.1.3"
description = "A focused, lightweight browser"
authors = ["Sleet contributors"]
license = "MIT"
edition = "2021"

[lib]
name = "sleet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "3.0.0-alpha.4", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# "devtools": page developer tools (Settings → Advanced, F12) in installed builds too, not only debug builds.
tauri = { version = "3.0.0-alpha.6", features = ["unstable", "devtools"] }
tauri-runtime-wry = { version = "3.0.0-alpha.6", features = ["unstable"] }
url = "2"
rusqlite = { version = "0.37", features = ["bundled"] }
base64 = "0.23"
# Password vault (see src/vault.rs): RustCrypto primitives, memory wiping, clipboard, CSV import.
argon2 = { version = "0.5", features = ["std", "zeroize"] }
chacha20poly1305 = { version = "0.10", features = ["std"] }
zeroize = { version = "1.8", features = ["derive", "serde"] }
arboard = { version = "3", default-features = false }
csv = "1"
# Signed in-app updates (switched on only when an update key is configured).
tauri-plugin-updater = "3.0.0-alpha.3"
# One Sleet at a time: a second launch (a link clicked in another app) hands
# its links to the running Sleet and exits.
tauri-plugin-single-instance = "3.0.0-alpha.3"
ureq = "3"
# Native Save as dialog for "Ask where to save each file".
rfd = { version = "0.15", default-features = false, features = ["gtk3"] }

[target.'cfg(target_os = "windows")'.dependencies]
webview2-com = "0.39"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_UI_WindowsAndMessaging"] }
windows-core = "0.62"
winreg = "0.56"

# "Remember on this device": the OS secure store on each platform.
[target.'cfg(target_os = "windows")'.dependencies.keyring]
version = "3"
features = ["windows-native"]

[target.'cfg(target_os = "macos")'.dependencies.keyring]
version = "3"
features = ["apple-native"]

[target.'cfg(target_os = "linux")'.dependencies.keyring]
version = "3"
features = ["sync-secret-service", "crypto-rust"]

# Argon2 is deliberately expensive; unoptimised debug builds would make unlocking take many seconds.
[profile.dev.package.argon2]
opt-level = 3
